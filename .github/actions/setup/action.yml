name: Set up the workspace
description: Bun, Node and the frozen install every check job needs.
inputs:
  playwright:
    description: Install Chromium for Playwright ("true" or "false").
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - run: bun install --frozen-lockfile
      shell: bash
    - if: inputs.playwright == 'true'
      run: bunx playwright install --with-deps chromium
      shell: bash
