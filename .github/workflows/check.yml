name: Check

# The repo's gate (what `bun run check` runs locally), split into parallel jobs. CI and the
# release workflow both call this, so a release is gated by exactly what a push is.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck

  unit:
    name: unit ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true" # the browser capture tests
      # zsh for the live terminal's shell tests; the runner image ships without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun run test --shard=${{ matrix.shard }}/3

  e2e:
    name: e2e ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      # zsh for the live terminal's shell tests; the runner image ships without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun run test:e2e --shard=${{ matrix.shard }}/3
      # Playwright's actual images, traces and error contexts, for diagnosing a failure on the runner.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: bun run test:tarball

  # One name for branch protection and for the release to depend on.
  ok:
    needs: [static, unit, e2e, tarball]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = true ]; then
            echo "::error::A check job failed or was cancelled."
            exit 1
          fi
