name: Release

# Releasing is: `bun run release X.Y.Z`, commit the bump to main, then tag that commit
# and push the tag (see "Releasing" in AGENTS.md). This workflow gates the tagged commit,
# packs @steamfield/decks once, and publishes that exact tarball to npm with provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# verify and build run in parallel; publish needs both. Rerunning a failed publish job reruns only
# that job and reuses the tarball the build job uploaded, so the same bytes go to npm.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify release version
        run: |
          version=$(node -p "require('./packages/decks/package.json').version")
          plugin=$(node -p "require('./plugins/decks/.claude-plugin/plugin.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Tag does not match package.json::Tag ${GITHUB_REF_NAME} points at a commit whose packages/decks/package.json version is ${version}. Run bun run release X.Y.Z, commit, and tag that commit. Delete the bad tag with: git push origin :refs/tags/${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "${plugin}" != "${version}" ]; then
            echo "::error title=Plugin version mismatch::plugins/decks/.claude-plugin/plugin.json is ${plugin} but the package is ${version}. Run bun run release ${version}, commit, and tag that commit."
            exit 1
          fi
      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag is not on main::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Release from main: delete the tag with git push origin :refs/tags/${GITHUB_REF_NAME}, merge the change to main, and tag that commit."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # lint, typecheck, unit and dom tests, browser tests, tarball test
      - run: bun run check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/decks
      - run: node scripts/release-publish.mjs pack packages/decks dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish at a time across tags; a second release queues instead of racing the first.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # Only this job can mint the OIDC token npm trusted publishing exchanges for a publish credential.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-package
          path: dist/release
      - name: Check npm supports trusted publishing
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)"; then
            echo "::error title=npm too old::npm $(npm -v) cannot publish with trusted publishing; the runner needs npm 11.5.1 or newer."
            exit 1
          fi
      - name: Publish to npm
        # Authenticates through npm trusted publishing (OIDC); no token is stored.
        run: |
          node scripts/release-publish.mjs publish dist/release

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - name: Create the GitHub release
        run: >
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag
          --title "${GITHUB_REF_NAME}" --generate-notes
          $( case "${GITHUB_REF_NAME}" in *-*) echo --prerelease ;; esac )
        env:
          GH_TOKEN: ${{ github.token }}
