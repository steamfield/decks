version: 1

# Remote test runs for the framework. `rr <task> --repeat N` spreads
# N runs across the hosts, which is how intermittent failures are hunted.
# mbp is this laptop (a local host in ~/.rr/config.yaml). It is last because rr takes the
# first host it can lock, in this order, so gates still land on the minis.
hosts: [m4-mini, m1-mini, m1-linux, mbp]

require: [bun, node]

defaults:
  setup:
    - bun install --frozen-lockfile

sync:
  # Setting exclude replaces rr's defaults, so they are repeated here. The test
  # scratch directories are ignored by a nested .gitignore, which rr does not read.
  exclude:
    - .git
    - node_modules
    - .venv
    - __pycache__/
    - .DS_Store
    - "*.log"
    - .claude/
    - .cursor/
    - .aider/
    - .copilot/
    - dist/
    - .tmp/
    - test-results/
    - playwright-report/
  preserve:
    - node_modules/
    - .tmp/

tasks:
  rd-test:
    description: react-decks unit and integration tests (Vitest). Pass a path after the task name.
    run: bun run test

  rd-e2e:
    description: react-decks browser tests (Playwright, Chromium). Pass a spec file or flags after --.
    run: bun run playwright install chromium && bun run test:e2e {args}

  rd-check:
    description: The react-decks gate (lint, typecheck, tests, browser tests).
    run: bun run playwright install chromium && bun run check

  # The live rr demo in examples/building-for-agents: one run fanned out over all four hosts.
  demo:
    description: Unit and dom tests in four shards, one per host (the talk's live demo).
    parallel: [demo-1, demo-2, demo-3, demo-4]
    fail_fast: false

  demo-1:
    run: bun run test --shard=1/4
  demo-2:
    run: bun run test --shard=2/4
  demo-3:
    run: bun run test --shard=3/4
  demo-4:
    run: bun run test --shard=4/4
